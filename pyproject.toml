[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "johnny-fleet"
version = "0.1.0"
description = "johnny — a shareable local inference environment manager (pluggable backends: vLLM, LM Studio, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rick Mellor", email = "rickmellor@gmail.com" }]
keywords = ["llm", "vllm", "inference", "fleet", "local", "gpu"]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "huggingface_hub>=0.24",
    "textual>=0.50",
]

[project.optional-dependencies]
# Quality/perf-eval suites for `johnny bench` (arc, icl, needle need openai(+datasets);
# depth needs llama-benchy — a backend-agnostic prefill/decode-vs-context-depth +
# latency bench, github.com/eugr/llama-benchy; humaneval needs lm-eval[api] — the
# [api] extra pulls in tenacity, required by lm-eval's local-chat-completions
# connector; evaluate/datasets ride along as lm-eval's own base deps).
bench = ["openai>=1.0", "datasets>=2.14", "llama-benchy>=0.4", "lm-eval[api]>=0.4"]

[project.scripts]
johnny = "johnny.cli:main"

[tool.hatch.version]
path = "src/johnny/__init__.py"

[tool.hatch.build.targets.wheel]
# Includes everything under src/johnny — incl. the bundled mlops scripts in
# src/johnny/scripts/ (bench/probes/eval harnesses) — so a clean install is
# self-contained; johnny/bundled.py resolves them at runtime.
packages = ["src/johnny"]
